
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de entradas</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 25px auto;
      padding: 16px;
      text-align: center;
      background: #f7f7f7;
      color: #222;
    }
    h1 { font-size: 27px; }
    button, input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 7px 0;
      font-size: 16px;
      border-radius: 8px;
    }
    button {
      border: 0;
      background: #333;
      color: white;
      cursor: pointer;
    }
    input { border: 1px solid #bbb; }
    #lector { width: 100%; margin-top: 15px; }
    #resultado {
      margin: 18px 0;
      padding: 18px 10px;
      border-radius: 10px;
      background: white;
      overflow-wrap: anywhere;
    }
    .ok { background: #d8f3dc !important; }
    .error { background: #ffe0e0 !important; }
    .aviso { background: #fff0c2 !important; }
    .pequeno { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>Control de entradas</h1>
  <p>Escaneá el QR o ingresá el código manualmente.</p>

  <button id="iniciar">Abrir cámara</button>
  <button id="detener">Detener cámara</button>

  <div id="lector"></div>

  <div id="resultado" role="status">
    Esperando una entrada…
  </div>

  <input id="codigo" type="text" placeholder="Ej.: T-ABC123456">
  <button id="validar">Validar ingreso</button>

  <p class="pequeno">
    Cada código se puede utilizar una sola vez.
  </p>

<script>
  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbwyISX3l7CsMUqn7aTFlFteR5W0ohdMEjubfZgsF4UrM5RwLFctsv2SYFcjdxTsHfdg/exec';

  let lector = null;
  let activo = false;
  let procesando = false;

  const resultado = document.getElementById('resultado');
  const campoCodigo = document.getElementById('codigo');

  function mostrar(mensaje, clase = '') {
    resultado.className = clase;
    resultado.textContent = mensaje;
  }

  function validarCodigo(codigo) {
    codigo = String(codigo || '').trim().toUpperCase();

    if (!codigo) {
      mostrar('Ingresá o escaneá un código.', 'aviso');
      return;
    }

    if (procesando) return;
    procesando = true;
    mostrar('Validando entrada…');

    const callback = 'respuestaQR_' + Date.now() + '_' +
      Math.floor(Math.random() * 100000);

    const script = document.createElement('script');
    let terminado = false;

    const finalizar = () => {
      if (terminado) return;
      terminado = true;
      procesando = false;
      delete window[callback];
      script.remove();
      clearTimeout(limite);
    };

    const limite = setTimeout(() => {
      finalizar();
      mostrar(
        'No se pudo confirmar el ingreso. Revisá la conexión e intentá nuevamente.',
        'error'
      );
    }, 15000);

    window[callback] = respuesta => {
      finalizar();

      if (!respuesta || !respuesta.ok) {
        mostrar(
          'Error: ' + (respuesta?.error || 'No se pudo validar la entrada.'),
          'error'
        );
        return;
      }

      const r = respuesta.resultado || {};

      if (r.estado === 'ok') {
        mostrar('✅ ' + r.mensaje + '\n' + (r.nombre || '') +
          '\nHora: ' + (r.hora || ''), 'ok');
        campoCodigo.value = '';
      } else if (r.estado === 'usada') {
        mostrar('⚠️ ' + r.mensaje + '\n' + (r.nombre || '') +
          '\nPrimer ingreso: ' + (r.hora || ''), 'aviso');
      } else {
        mostrar('❌ ' + (r.mensaje || 'Entrada no válida.'), 'error');
      }
    };

    script.onerror = () => {
      finalizar();
      mostrar(
        'No se pudo conectar con Google. Verificá el acceso de la aplicación.',
        'error'
      );
    };

    const parametros = new URLSearchParams({
      action: 'validar',
      codigo: codigo,
      callback: callback
    });

    script.src = URL_APPS_SCRIPT + '?' + parametros.toString();
    document.body.appendChild(script);
  }

  document.getElementById('validar').addEventListener('click', () => {
    validarCodigo(campoCodigo.value);
  });

  campoCodigo.addEventListener('keydown', evento => {
    if (evento.key === 'Enter') validarCodigo(campoCodigo.value);
  });

  document.getElementById('iniciar').addEventListener('click', async () => {
    try {
      if (!lector) lector = new Html5Qrcode('lector');

      mostrar('Solicitando acceso a la cámara…');

      const camaras = await Html5Qrcode.getCameras();
      if (!camaras.length) throw new Error('No se encontraron cámaras.');

      const trasera = camaras.find(c =>
        /back|rear|environment|trasera|posterior/i.test(c.label)
      ) || camaras[camaras.length - 1];

      await lector.start(
        trasera.id,
        { fps: 10, qrbox: { width: 230, height: 230 } },
        texto => {
          if (procesando) return;
          campoCodigo.value = texto.trim();
          validarCodigo(texto);
        },
        () => {}
      );

      activo = true;
      mostrar('Cámara activa. Apuntá al código QR.');
    } catch (error) {
      mostrar('No se pudo iniciar la cámara: ' + error.message, 'error');
    }
  });

  document.getElementById('detener').addEventListener('click', async () => {
    try {
      if (lector && activo) await lector.stop();
      if (lector) lector.clear();
      activo = false;
      mostrar('Cámara detenida.');
    } catch (error) {
      mostrar('Error al detener la cámara: ' + error.message, 'error');
    }
  });
</script>
</body>
</html>
