
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de entradas</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
    }
    button {
      padding: 14px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    #lector { width: 100%; margin-top: 20px; }
    #resultado { font-size: 18px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Control de entradas</h1>
  <p>Prueba de cámara y lectura de QR</p>
  <button id="iniciar">Abrir cámara</button>
  <button id="detener">Detener cámara</button>
  <div id="lector"></div>
  <div id="resultado">Esperando para iniciar…</div>

  <script>
    let lector = null;
    let activo = false;

    document.getElementById('iniciar').onclick = async () => {
      const resultado = document.getElementById('resultado');
      resultado.textContent = 'Solicitando acceso a la cámara…';

      try {
        if (!window.isSecureContext) {
          throw new Error('La página debe abrirse mediante HTTPS.');
        }

        if (!lector) lector = new Html5Qrcode('lector');

        const camaras = await Html5Qrcode.getCameras();
        if (!camaras.length) throw new Error('No se encontraron cámaras.');

        const trasera = camaras.find(c =>
          /back|rear|environment|trasera|posterior/i.test(c.label)
        ) || camaras[camaras.length - 1];

        await lector.start(
          trasera.id,
          { fps: 10, qrbox: { width: 230, height: 230 } },
          texto => {
            resultado.textContent = 'QR leído: ' + texto;
          },
          () => {}
        );

        activo = true;
        resultado.textContent = 'Cámara activa. Apuntá al código QR.';
      } catch (e) {
        resultado.textContent = 'No se pudo abrir la cámara: ' + e.message;
      }
    };

    document.getElementById('detener').onclick = async () => {
      try {
        if (lector && activo) await lector.stop();
        if (lector) lector.clear();
        activo = false;
        resultado.textContent = 'Cámara detenida.';
      } catch (e) {
        document.getElementById('resultado').textContent =
          'Error al detener la cámara: ' + e.message;
      }
    };
  </script>
</body>
</html>
